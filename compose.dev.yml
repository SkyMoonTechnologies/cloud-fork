# Local development control plane for SkyMoon Cloud.
# Do NOT expose this deployment to the public Internet.
services:
  skymoon-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloud
      MYSQL_USER: cloud
      MYSQL_PASSWORD: ${SKYMOON_DEV_DB_PASSWORD:?Set SKYMOON_DEV_DB_PASSWORD in Komodo}
      MYSQL_ROOT_PASSWORD: ${SKYMOON_DEV_DB_ROOT_PASSWORD:?Set SKYMOON_DEV_DB_ROOT_PASSWORD in Komodo}
      MYSQL_ROOT_HOST: "%"
    command:
      - --max-connections=350
      - --innodb-rollback-on-timeout=1
      - --innodb-lock-wait-timeout=600
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    volumes:
      - skymoon-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  skymoon-management:
    build:
      context: .
      dockerfile: management/dev/Dockerfile
    restart: unless-stopped
    # Run the Git-tracked startup script instead of the copy baked into the
    # old Java image, so configuration fixes do not require a Maven rebuild.
    command: ["/bin/bash", "/opt/skymoon/management/dev/start.sh"]
    volumes:
      - ./management/dev/start.sh:/opt/skymoon/management/dev/start.sh:ro
      # Read-only provider extension code; persisted intent journal below.
      - ./extensions/DigitalOcean:/opt/skymoon/extensions/DigitalOcean:ro
      - skymoon-dev-provider-state:/var/lib/skymoon-providers
    environment:
      SKYMOON_DEV_DB_PASSWORD: ${SKYMOON_DEV_DB_PASSWORD:?Set SKYMOON_DEV_DB_PASSWORD in Komodo}
      SKYMOON_DEV_DB_ROOT_PASSWORD: ${SKYMOON_DEV_DB_ROOT_PASSWORD:?Set SKYMOON_DEV_DB_ROOT_PASSWORD in Komodo}
      # These must be set in Komodo (or local untracked environment), never committed.
      SKYMOON_DEV_DO_TOKEN: ${SKYMOON_DEV_DO_TOKEN:-}
      SKYMOON_DO_REGION: ${SKYMOON_DO_REGION:-}
      SKYMOON_DO_SIZE: ${SKYMOON_DO_SIZE:-}
      SKYMOON_DO_IMAGE: ${SKYMOON_DO_IMAGE:-}
      SKYMOON_DO_VPC_UUID: ${SKYMOON_DO_VPC_UUID:-}
      SKYMOON_DO_STATE_DIR: /var/lib/skymoon-providers/digitalocean
      SKYMOON_DO_ALLOW_CREATE: ${SKYMOON_DO_ALLOW_CREATE:-false}
      SKYMOON_DO_ALLOWED_SIZES: ${SKYMOON_DO_ALLOWED_SIZES:-s-1vcpu-1gb}
    depends_on:
      skymoon-db:
        condition: service_healthy
    # Only internal Docker networking. Do not publish management/API ports yet.

  skymoon-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.demo
      args:
        SKYMOON_NGINX_CONFIG: nginx/dev.conf
    restart: unless-stopped
    ports:
      - "5081:80"
    depends_on:
      - skymoon-management

volumes:
  skymoon-dev-mysql:
  skymoon-dev-provider-state:
